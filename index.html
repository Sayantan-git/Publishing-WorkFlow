d worker application tokens follow different validation paths.",stores:"Gateway request diagnostics. APIM does not store the menu or own the schedule.",failure:"A rejected token or source address can stop the request before the API creates work. Gateway acceptance is not the same as permission to perform every business action.",concept:"API gateway, authentication, authorization, and trust boundaries."},api:{name:"Backend APIs",short:"Backend API",icon:"server",group:"Processing",color:"#326cac",definition:"Server-side programs that check requests, build menu data, and coordinate publishing.",why:"Business rules and database work belong on the server, not only in a browser button.",details:"The user-facing API creates business records. The integration API prepares restaurant data and receives status reports. Registering JWT validation is not the same as requiring authorization on every endpoint; effective gateway and backend rules must be verified.",stores:"APIs write to SQL and Cosmos DB. They are not an additional database.",failure:"A later call can fail after earlier writes succeeded. The whole workflow is not one all-or-nothing transaction.",concept:"Validation, orchestration, and service-to-service communication."},sql:{name:"SQL database",short:"SQL",icon:"database",group:"Storage",color:"#946b24",definition:"The relational database for editable menu data, future schedules, and overall publish records.",why:"It holds the durable business facts: restaurant, request, scheduled time, and current summary.",details:"Writes use the primary database. Scheduled-work selection uses a read-only connection, which may point to a replica. A replica can lag behind recent writes. Preparation reloads a newly created publish from the primary.",stores:"Source menus, schedule records, publish identity, processing flags, and summary state.",failure:"A saved or processed record does not prove its next message was sent. SQL summaries can lag behind detailed status events.",concept:"Relational storage, read replicas, consistency, and durable requests."},bus:{name:"Azure Service Bus",short:"Service Bus",icon:"inbox",group:"Messaging",color:"#137d77",definition:"A message broker that holds work and delivers notifications between separate systems.",why:"The sender can hand over work without waiting for every receiver to finish.",details:"A queue gives work to a worker. A topic lets matching subscriptions receive their own copies. A message may be delivered again. Broker delivery counts are different from application retry attempts and business status events.",stores:"Messages, delivery metadata, locks, and dead-letter messages under configured policies.",failure:"Messages can expire or reach a delivery limit. Dead-letter storage is not automatic recovery and does not create a new publish.",concept:"Asynchronous messaging, buffering, publish/subscribe, and at-least-once delivery."},function:{name:"Azure Functions",short:"Function",icon:"zap",group:"Processing",color:"#aa761c",definition:"Backend code that runs when something triggers it, such as an arriving message.",why:"It starts background work independently of the user\u2019s browser.",details:"A preparation Function consumes a message and calls the integration API. Other Functions process status messages. Detailed menu-building rules remain in business logic. A Function coordinates work; it is not a database.",stores:"Execution diagnostics and records written through the services it calls.",failure:"An error must reach the trigger to be treated as a failed delivery. A caught error or ignored HTTP response can make an incomplete operation look like a successful invocation.",concept:"Event-driven processing, background workers, and error propagation."},timer:{name:"Timer-triggered Functions",short:"Timer",icon:"clock",group:"Processing",color:"#987023",definition:"Azure Functions started by a clock schedule instead of a new message.",why:"They start future work and revisit pending work without a new user action.",details:"The scheduled-publish processor checks every 15 minutes. Other timers reconcile summaries, revisit selected readiness work, request expiry cancellation, or clean up old data. Each has its own query and purpose.",stores:"Timers read SQL and sometimes Cosmos history. The timer itself does not store future schedules.",failure:"A timer can run and find no eligible records. Another tick cannot fix an excluded record, incorrect query, or already-processed schedule by itself.",concept:"Polling, scheduling, bounded recovery, and reconciliation."},cosmos:{name:"Azure Cosmos DB",short:"Cosmos DB",icon:"orbit",group:"Storage",color:"#367fa0",definition:"A document database holding prepared menu packages and detailed progress history.",why:"The menu is a document-shaped package, and many systems can report events for one publish.",details:"Payloads and status history are separate collections. A publish identifier groups related documents. Each document also has its own identity. Saving a staging report and saving a menu package are different writes.",stores:"Compressed menu packages and per-system events with status, reason, and timestamps.",failure:"If Cosmos is unavailable, even the failure event may not be saved. No error document does not prove success.",concept:"Document storage, partitioning, event history, and separate summaries."},downstream:{name:"Receiving systems & POS",short:"Receiving systems",icon:"store",group:"Restaurant",color:"#477654",definition:"Systems that fetch and prepare updates, including the restaurant\u2019s Point of Sale system.",why:"MM2 prepares and coordinates the change. The restaurant system performs the final application.",details:"POS and other configured systems may have to stage data. Staging means preparing it before activation. Another system reporting completion is not proof that POS applied the menu.",stores:"Each receiver has its own working state. Its reports are stored in MM2\u2019s Cosmos history and reflected in SQL summaries.",failure:"A store can be offline or fail after the payload already exists. Missing completion may be an application failure or a reporting failure.",concept:"Independent consumers, readiness gates, and distributed coordination."},identity:{name:"Identity & JWT",short:"Identity",icon:"key-round",group:"Access",color:"#436ba3",definition:"Identity services and signed tokens let a receiver check who is making a request.",why:"A browser user and an automated worker should not share the same identity.",details:"MM2 creates the browser user JWT. A worker obtains an Entra application token with server-side client credentials for relevant HTTP calls. It reuses a cached token with more than five minutes left, otherwise requests a new one. This is not user-token refresh.",stores:"User token in browser state; worker token in process memory. Neither stores the publish schedule.",failure:"A wrong audience, expired token, bad signature, or client configuration can reject a call before menu work starts.",concept:"Signed claims, bearer tokens, application identity, and least privilege."},vault:{name:"Azure Key Vault",short:"Key Vault",icon:"vault",group:"Access",color:"#796937",definition:"Protected storage for application secrets and keys.",why:"Secrets used by backend systems must not be exposed in the browser.",details:"Configured helpers obtain secrets such as JWT signing, Cosmos access, and external integration credentials. The identity that reads a secret and its permissions are separate from the user who requests a publish.",stores:"Secrets and keys, not menus, schedules, or retry history.",failure:"Access denial or mismatched key material can stop a call before a publishing event is recorded.",concept:"Secret management, key rotation, and least privilege."},monitor:{name:"Application Insights & logs",short:"Diagnostics",icon:"activity",group:"Operations",color:"#756080",definition:"Technical observations about requests, workers, exceptions, and dependencies.",why:"They help explain the failed handoff behind a business status.",details:"Correlate gateway, API, and Function records using the relevant request or publish identifier. Attempts that are logged, exception messages, and HTTP outcomes are evidence. Do not expose full tokens or secrets.",stores:"Logged retry attempts, dependency timing, Function runs, exceptions, and token or HTTP errors.",failure:"Telemetry can be incomplete. A successful Function invocation does not prove every inner operation or restaurant application succeeded.",concept:"Observability, correlation, and failure diagnosis."},blob:{name:"Azure Blob Storage",short:"Blob Storage",icon:"archive",group:"Operations",color:"#5d7985",definition:"Storage for file-like objects, including diagnostic copies of POS payloads.",why:"Support may need to inspect a payload-log file when investigating a restaurant issue.",details:"The active preparation path verified here saves its prepared menu to Cosmos DB. A separate Blob lookup reads diagnostic POS payload logs. A Blob upload is not a verified mandatory step before every publish.",stores:"Diagnostic objects when produced by the owning system, under separate retention rules.",failure:"A missing diagnostic file does not prove the menu package was never saved to Cosmos.",concept:"Object storage, retention, and supporting evidence outside the critical path."}},hr=[["Publish","The full operation that prepares, delivers, stages, and confirms a menu update at the restaurant.","Saving a price or accepting an API request is only an earlier milestone."],["Payload","The package of menu data prepared for a restaurant publish.","A notification announces the package. The package itself is saved in Cosmos DB."],["Staging","Preparing received data before making it active.","POS can stage a new menu while the restaurant still uses the old menu."],["Asynchronous processing","Hand work to another component without waiting for its entire business operation to finish.","The API returns while a Function handles a queued request later."],["Queue","Storage for work that workers collect. One consumer handles a particular delivery.","The preparation message waits for a worker."],["Topic and subscription","A topic distributes an event to matching subscriptions, each with its own copy.","Several receiving systems can be notified about the same prepared publish."],["Retry","Repeat a failed operation, which may be just one send or one build block.","The sender retries a temporary broker error without creating a new publish."],["Backoff","Wait before retrying so a dependency is not hit continuously.","The shown application retry waits are 2, 4, and 5 seconds."],["Redelivery","A broker delivers a message again under its delivery rules.","A failed status Function can receive the same message in a later invocation."],["Dead-letter queue","A separate broker area for messages that cannot be delivered normally.","It holds evidence for investigation, not a promise of automatic replay."],["Idempotency","Repeating a request should not incorrectly repeat its business effect.","Duplicate work must not cause a second unsafe live discard."],["Reconciliation","Compare records and update a summary that is behind known progress.","Completion history can exist in Cosmos while SQL still says publishing."],["Read replica","A copy of a primary database used for reads. Recent writes can take time to arrive.","The scheduled-work lookup uses a read-only connection."],["Eventual consistency","Related records can temporarily show different progress and agree after later updates.","A status event can be saved before its SQL summary update succeeds."],["Correlation identifier","A shared identifier used to follow an operation through records, messages, and logs.","A separate identifier connects each restaurant publish across services."],["JWT","A signed token with claims such as identity, audience, and expiry. Decoding is not validation.","Browser user tokens and worker application tokens identify different callers."],["Authentication and authorization","Authentication checks identity; authorization checks whether that identity may perform the action.","A valid JWT is not permission to publish every restaurant."],["Distributed transaction","One all-or-nothing operation across multiple services. This flow does not share one across SQL, Cosmos, and messaging.","A saved SQL record can exist even though its next queue send failed."],["Polling","Repeatedly check for eligible work on a schedule.","The scheduled-publish timer checks at quarter-hour intervals."],["Retention and TTL","Rules governing how long data is kept. TTL means time to live.","SQL archives, cleanup jobs, and Cosmos document expiry are separate mechanisms."]].map(([e,t,a])=>({term:e,text:t,example:a})),yh=[{id:"request",title:"Request",description:"The user hands over work"},{id:"wait",title:"Wait & select",description:"A timer starts eligible work"},{id:"prepare",title:"Prepare",description:"Build a menu package"},{id:"stage",title:"Deliver & stage",description:"The receiving systems get ready"},{id:"apply",title:"Apply & confirm",description:"The restaurant reports its result"}];function Me(e,t,a,o,n,l,r,i,s,u,c,f,d,p=[]){return{id:e,title:t,label:a,service:o,phase:n,summary:l,explanation:r,input:i,work:s,output:u,saved:c,failure:f,concepts:d,services:[...new Set([o,...p])]}}var yt={click:Me("click","A user requests publication","Request publish","browser","request","Start the work now, not instantly replace the active menu.",`The UI sends selected restaurants and the user session to the configured API route. Emergency means immediate/manual publication. It does not have a separate priority queue.

The browser asks the backend to begin work; it does not build or install the menu itself. The request still needs access checks and restaurant-specific validation before a publish can be created. Once background work is accepted, it can continue independently of the browser.

For example, requesting a price update for two restaurants starts two restaurant-specific journeys. One restaurant may finish before the other. A response in the browser is not evidence that either POS, the Point of Sale system, has activated the new prices.`,"Restaurant selections and a signed-in user.","Send the request.","An HTTP request for the API to evaluate.","No prepared menu or confirmed restaurant change yet.","Sign-in or connectivity can prevent the request from reaching the backend.",["Authentication and authorization"],["gateway"]),gateway:Me("gateway","The gateway checks the request","Check access","gateway","request","APIM can reject a request before publishing records exist.",`In a gateway-enabled deployment, configured IP, browser-origin, and JWT checks apply. Accepted traffic is forwarded to the backend. Application permission and endpoint protection are separate concerns.

Azure API Management, or APIM, is an entry point in front of the API. A JWT is a signed identity token; validation checks its authenticity and applicable claims, such as audience and expiry. Authentication establishes who is calling. Authorization determines whether that caller may perform the requested action.

For example, an expired user token can be rejected before any publish record is saved. If the request passes the gateway, the backend still needs to evaluate the restaurant and menu. Passing an access check is not the same as passing a business-rule check.`,"The HTTP request and user bearer token.","Check the configured token and gateway rules.","An accepted request or a gateway rejection.","Gateway diagnostics, not a completed publish.","An invalid token or source address stops this path. Gateway success does not mean the menu is valid.",["JWT","Authentication and authorization"],["identity","monitor"]),validate:Me("validate","The API checks whether work can start","Validate request","api","request","Every selected restaurant is evaluated separately.",`The immediate path checks menu completeness and current publishing state. It does not create another publish for a restaurant already publishing. For eligible restaurants it attempts to cancel older work that can safely be replaced.

These checks protect the restaurant from an incomplete menu or overlapping updates. A valid user request can still be unsuitable for processing. Cancelling replaceable work is also a real backend operation, so a reported cancellation failure can prevent the new attempt from proceeding.

For example, one selected restaurant may have a complete template while another is already publishing. Check the result for each restaurant instead of assuming one click means all selections can proceed. This step allows new work to start; it does not roll back a menu that is already active.`,"Restaurant setup and existing publish state.","Validate, check conflicts, and cancel safely where required.","Restaurants allowed to proceed.","Existing menu and earlier records remain.","Incomplete templates or reported cancellation failure can stop a new attempt.",["Idempotency"],["sql","downstream"]),record:Me("record","Create the business record","Save publish record","sql","request","SQL gets one publish per restaurant; Cosmos gets the first status event.",`The API looks up current restaurant settings in primary SQL, creates a new publish identifier, and marks the overall state as publishing. It writes a request-received event to Cosmos. Optional receiving-system integration can also run when configured.

The publish identifier connects this attempt across messages, menu data, status reports, and logs. SQL holds the business record and overall summary. Cosmos history records the initial event. These are separate writes, and neither is the prepared menu package that consumers will fetch later.

For example, publishing to two restaurants creates separate publish identities. Use the relevant identity when following a restaurant through later steps. If queueing fails next, the saved record still explains which attempt was started, but its publishing state does not prove preparation is running.`,"Validated restaurants and current settings.","Save the business record and initial status.","A publish identifier for later messages and data.","SQL: identity and summary. Cosmos history: request received. No menu package yet.","A later message send can fail after these writes succeeded.",["Correlation identifier","Distributed transaction"],["cosmos","api"]),chooseTime:Me("chooseTime","Choose a future publish time","Choose publish time","browser","request","The chosen time is a start-selection time, not guaranteed POS activation.",`The UI submits restaurants and a UTC time with the user session. The configured gateway and API checks still apply. The API checks templates and attempts safe cancellation of previous work.

UTC is a shared time reference, so compare it carefully with the local restaurant time when planning a change. The time controls when a schedule may be selected for processing. Building, delivering, staging, and applying the menu are later operations and can add more delay.

For example, a request for 14:07 UTC is outside the selection window at 14:00. The 14:15 check can select it if the other rules pass. That does not promise the restaurant will activate its menu at 14:07 or 14:15; it only explains when preparation can start.`,"Restaurants, user identity, and UTC time.","Validate the scheduling request.","A request to save future work.","No new prepared menu or dispatched publish yet.","Login, template, or cancellation problems can prevent scheduling.",["Authentication and authorization","Polling"],["gateway","api"]),schedule:Me("schedule","Save future work in SQL","Save future work","sql","request","This is a schedule, not a message waiting in Service Bus.",`The primary SQL database saves the restaurant, future time, user, and configuration references. The schedule starts unprocessed and uncancelled. This path does not create the new publish record yet.

The saved record lets a later background check find the request without depending on an open browser. Unprocessed means the schedule has not yet been turned into a publish. It does not mean a worker already has a queued menu, and it does not freeze a complete copy of the menu content.

For example, after saving work for tomorrow, expect a SQL schedule but no new preparation message or Cosmos menu package for that request. If the browser closes, the saved schedule remains. Whether it starts later still depends on the timer, the selection rules, and successful handoffs.`,"A validated schedule request.","Save the future-work record and return to the browser.","A schedule available to later checks.","SQL: schedule only. No preparation message or new Cosmos package.","A successful save does not prove that a later lookup or send succeeds.",["Polling","Distributed transaction"],["api"]),timer:Me("timer","A timer checks for future work","15-minute timer","timer","wait","The clock starts a background Function at quarter-hour intervals.",`The scheduled-publish Function calls the backend using its own application identity, not the old browser JWT. It checks regularly rather than waking once for each individual schedule.

This pattern is called polling: a worker repeatedly asks whether any saved work now qualifies. Its service identity allows the check to run after the user has left. The timer starts the check, but the SQL query decides which schedules are eligible; a successful timer run can legitimately return no work.

For example, the 14:00 check may find no eligible schedules while the 14:15 check finds a request for 14:07. If no publish appears, distinguish a failed timer or HTTP call from a successful check that selected nothing. They need different investigations.`,"The current time and configured service access.","Ask the scheduled-work API to find eligible records.","A schedule-selection query.","Execution information in diagnostics; schedules stay in SQL.","An HTTP or token error can prevent a useful check. A timer run is not proof any schedule was selected.",["Polling","JWT"],["identity","api","monitor"]),lookup:Me("lookup","Select eligible schedules from SQL","Select due work","sql","wait","The schedule lookup reads SQL through a read-only connection, not Cosmos.",`The query requires unprocessed, uncancelled work and publishing enabled for the restaurant. Its UTC window is seven days back to one minute ahead. The read-only connection may be a replica or the same database in a local setup.

A due time alone is not enough: all eligibility conditions must pass together. The backward window allows recent overdue work to be considered, but it is not unlimited catch-up. If reads use a replica, a recent write may not be visible there immediately even though it succeeded on the primary database.

For example, at 14:00 a schedule for 14:01 is inside the one-minute early window, but one for 14:07 is not. A cancelled schedule qualifies for neither case. When expected work is missing, check the time, flags, publishing setting, and read visibility before blaming menu preparation.`,"Saved schedules, current time, and restaurant settings.","Apply eligibility and time rules.","Eligible restaurants, or nothing on this tick.","SQL owns the future-work records. Cosmos is not the scheduling source.","Replica lag, cancellation, disabled publishing, or an out-of-window time can exclude a record.",["Polling","Read replica","Eventual consistency"],["timer"]),dispatch:Me("dispatch","Turn the schedule into a publish","Create & mark dispatched","sql","wait","The schedule is marked processed before the preparation message is sent.",`The backend creates a publish from the settings available when processing runs. It saves the initial status and links the schedule to that publish. The menu is built later, so saving a schedule did not freeze all its content.

This is where a future request becomes a concrete publishing attempt with its own identifier. Marking the schedule processed excludes it from ordinary later scans. That flag describes schedule handling; it is not confirmation that the broker accepted a message or that a restaurant received anything.

For example, if the next queue send fails, SQL can contain both a processed schedule and a publish that never reached preparation. Waiting for another quarter-hour check will not normally select that schedule again. Follow the linked publish and failed handoff when deciding on authorized recovery.`,"An eligible schedule and current settings.","Create the publish and mark its schedule processed.","A new publish ready for queueing.","SQL: publish and processed schedule. Cosmos: request received. No menu package yet.","A failed queue send does not make the processed schedule eligible for the next ordinary scan.",["Distributed transaction","Correlation identifier"],["api","cosmos"]),queue:Me("queue","Hand preparation to a queue","Queue preparation","bus","prepare","The browser can finish while the background request waits for a worker.",`The API sends the publish information to Service Bus. It may briefly delay messages to spread load. This throttle delay is different from a user-selected future schedule. Selected send exceptions have bounded retries.

The queue separates accepting work from doing the slower preparation. A message identifies the publish that needs attention; it is not the complete menu. Broker acceptance confirms this handoff only. The Function still has to receive the message, call the backend, and get the package built.

For example, a busy worker can leave an accepted message waiting while SQL already says publishing. That differs from a failed send, where the broker may never have accepted the work. Compare send results and broker delivery evidence before deciding whether preparation is merely delayed or was never queued.`,"A new publish record and identifier.","Send or briefly delay a preparation message.","Work for the preparation Function.","Service Bus: message and delivery state. SQL and Cosmos keep earlier records.","Selected failures retry after 2, 4, and 5 seconds. Exhaustion records request failure when status storage is available.",["Queue","Backoff","Asynchronous processing"],["api","monitor"]),worker:Me("worker","A message triggers preparation","Function starts work","function","prepare","The worker uses an application token, not the browser user token.",`The Function reads the publish identifier and calls Integrations. The backend reloads the newly created record from primary SQL and marks preparation started. The queue message is a handoff, not the full menu.

The Function coordinates the handoff; the integration backend owns the menu-building rules. Its application token represents an automated service, so the original user does not need to keep a browser session alive. Reloading from primary SQL avoids relying on a replica to have caught up with the newly saved publish.

For example, a delivered message can start a Function even when the subsequent HTTP call is rejected. In this preparation path, inner errors can be caught or responses ignored. Check the API outcome and preparation evidence as well as the Function invocation; a successful invocation alone is not enough.`,"A preparation message and publish identifier.","Obtain service identity and call the backend.","A restaurant-menu preparation operation.","SQL: preparation started. Broker: delivery state. Diagnostics: Function and HTTP evidence.","This Function catches inner HTTP errors and ignores responses. Not every preparation failure reaches its trigger for redelivery.",["Asynchronous processing","JWT","Redelivery"],["identity","gateway","api","sql"]),build:Me("build","Build and store the menu package","Build & store menu","cosmos","prepare","The backend prepares a valid menu and saves it as a compressed document.",`Business logic reads menus, products, prices, discounts, taxes, and settings from SQL. Applicable versions also use screen-design data. An empty menu is a failure. Exceptions inside the protected retrieval/build block can trigger its own retries.

The result is a restaurant-specific payload: the package that receiving systems will retrieve. Compression reduces its stored representation without making it an active restaurant menu. The prepared package and progress history are separate Cosmos data, and SQL is marked preparation complete after the package is stored.

For example, a price change can affect more than one field in the final menu package because related product and tax data are also needed. A saved package proves preparation reached storage, not that consumers were notified. If notification fails next, inspect the existing payload before assuming it must be rebuilt.`,"Source menu data and applicable external information.","Build, validate, compress, and store.","A prepared package for later retrieval.","Cosmos payload: saved menu. SQL: preparation complete after storage.","Build exceptions can be retried three times. A final failure normally creates a Cosmos failure event if that write succeeds. Returning no data is not an exception retry.",["Payload","Retry","Backoff"],["api","sql","monitor"]),notify:Me("notify","Notify interested consumers","Notify consumers","bus","stage","The topic announces the package; it does not contain the entire menu.",`The backend sends an identifier and update context to a topic. Matching subscriptions receive their own notifications. After a successful send, SQL records the notification as sent.

Unlike a work queue handing a delivery to a worker, a topic can distribute copies to several interested systems. Each matching subscription has its own delivery progress. This lets receivers fetch the stored package independently, but it also means a successful send does not establish that every receiver has processed its copy.

For example, POS and another configured system may both need the update. POS can receive its notification while the other system is delayed. Follow each required receiver through staging; the sent flag only describes the notification handoff, not their readiness or the final restaurant outcome.`,"A stored menu and publish identity.","Publish an availability notification.","Messages for the configured receiving systems.","Service Bus: subscription deliveries. SQL: sent flag. Cosmos: prepared package.","A package can exist even when sending fails. A send can also succeed before a later SQL flag update fails.",["Topic and subscription","Distributed transaction"],["sql","cosmos","monitor"]),stage:Me("stage","Receiving systems fetch and stage","Retrieve & stage","downstream","stage","Preparing data is not the same as activating it at the restaurant.",`POS and other enabled systems retrieve the saved package through integration APIs. Each prepares its part and reports progress independently. The external systems own their internal transport and restaurant behavior.

Staging means getting an update ready before making it active. It separates receiving data from switching the live restaurant menu. MM2 depends on reports from the participating systems to know their progress; retrieving the package alone does not establish that staging finished or that every required system is ready.

For example, POS may stage the new prices while another required system reports a failure. The existing menu can still be active during staging. The reports must be combined before deciding whether to enable Apply Now, keep waiting, or consider a safe discard of staged work.`,"A topic notification and saved payload.","Retrieve data and prepare the update.","Reports of staging success, failure, or non-participation.","Each receiver has working state. Reported events return to Cosmos through the status API.","One system can stage successfully while another fails. Some configured systems can report they are not applicable.",["Staging","Topic and subscription"],["api","cosmos"]),status:Me("status","Store and process status reports","Record status history","cosmos","apply","The API saves the event first, then queues it for processing.",`The current external status API appends the report to Cosmos with system, reason, and times. It sends a message grouped by publish identity. A Function reads history, checks staging, distributes a combined state, and updates the SQL summary. Some internal helpers take a direct status-notification path.

History answers what each system reported, while the SQL summary gives an overall view. They can temporarily disagree because saving the report, sending its processing message, and updating the summary are separate operations. This is eventual consistency: related records can catch up at different times rather than changing together.

For example, Cosmos may already contain a POS staging-completed event while SQL still shows publishing. Follow the status message and worker before concluding POS failed to stage. Repeated callbacks can also create multiple history documents, so several documents do not necessarily mean several different publishes.`,"A downstream progress or failure report.","Save history, queue processing, and calculate combined state.","An updated view for readiness and overall status.","Cosmos: history. SQL: summary when updated. Service Bus: event-processing messages.","The event can exist while the next send fails. Repeated callbacks can create multiple documents. Reconciliation fixes summaries, not necessarily the business failure.",["Eventual consistency","Reconciliation","Correlation identifier"],["api","bus","function","sql"]),readiness:Me("readiness","Check readiness before Apply Now","Check readiness","function","apply","MM2 waits for the required systems before asking to enable Apply Now.",`The processor checks participation, staging, relevant errors, cancellation, completion, existing wait, and offline conditions. It can save a combined staging marker, then request external Apply Now enablement when allowed.

Readiness is a decision based on combined evidence, not just the most recent success report. Required systems depend on configuration and participation. Waiting for a missing report differs from handling a reported failure, an offline restaurant, or an already cancelled publish; those conditions must not all be treated as ready.

For example, POS staging alone is insufficient if another participating system has not completed its required staging. When the conditions pass, MM2 can ask the receiving system to enable Apply Now. Acceptance of that request still does not mean the restaurant has taken the apply action or activated the menu.`,"Combined status history and enabled-system settings.","Check readiness and send enablement if allowed.","Apply Now requested, or continued waiting/failure handling.","Cosmos: readiness or offline reports. SQL: summary. HTTP acceptance is not an applied menu.","An unsuccessful call can trigger message redelivery if the error escapes. The separate timer fallback has narrow selection and a checked-in date-range defect.",["Staging","Redelivery","Reconciliation"],["cosmos","downstream","timer"]),apply:Me("apply","The restaurant applies and reports","Apply & confirm","downstream","apply","Only the restaurant outcome confirms this final step.",`POS applies through its own workflow and reports the result. MM2 processes that event through status handling. The normal successful SQL summary becomes ready for another publish when all required completion conditions are met.

This is the point where a staged update becomes an actual restaurant change. The restaurant owns that action, while MM2 records and summarizes the reported outcome. A queued message, prepared package, or accepted Apply Now request is an earlier milestone and cannot replace a POS completion report.

For example, new prices may have been prepared and staged successfully, but the publish is not confirmed just because another receiving system reports completion. Look for the POS result for the same publish identity. If the report is missing, investigate both application and reporting: the menu may have changed even if its confirmation did not arrive.`,"A ready staged update and the restaurant\u2019s apply action.","Apply the menu and report its result.","A confirmed restaurant outcome or a failure to investigate.","Cosmos: completion reports. SQL: overall summary. Restaurant: its active menu.","A missing report can mean application failure or reporting failure. Another system\u2019s completion is not a substitute for POS evidence.",["Correlation identifier","Eventual consistency"],["cosmos","sql"]),retry:Me("retry","Retry one operation","Retry this operation","api","prepare","A retry is not a new business publish.",`The illustrated send/build policies allow three repeats after the initial attempt, with 2-, 4-, and 5-second waits. Only their protected operation repeats. SDK retries and broker redelivery are separate layers.

That means up to four attempts in one application retry block, not four complete publishing journeys. Waiting between attempts is called backoff; it gives a temporarily unavailable dependency a chance to recover. Earlier successful writes remain in place, and retrying does not automatically create a new publish identifier or a new history event.

For example, if a queue send fails and its next attempt succeeds, the same publish can continue to preparation. If all allowed attempts fail, control moves to failure handling. Compare application attempt logs with broker delivery counts separately; they measure different operations and should not be added as though they were one counter.`,"A matching exception from a protected operation.","Wait and repeat that operation.","Success or a final failure.","Diagnostic attempt information where logged. Not automatically one SQL or Cosmos event per retry.","Exhaustion returns control to failure handling. There is no universal automatic restart of the whole menu workflow.",["Retry","Backoff","Idempotency"],["bus","monitor"]),failure:Me("failure","Record and investigate failure","Failure recorded","cosmos","prepare","Business failure, SQL summary, and broker delivery are distinct evidence.",`A caller can append a failure event when status storage is available. SQL may be recalculated later. A status-database outage can prevent even that event, leaving technical logs as important evidence.

The flow is not one transaction that rolls back every earlier effect. A failed attempt can still leave a business record, payload, delivered message, or staged data. Start with the publish identifier and find the last confirmed handoff, then compare history, summary, broker state, and diagnostics to locate what did not finish.
